<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alfama walk — cross-document view transition</title>
<style>
  /* Required in this document too. A rule on only one side of the navigation
     does nothing — that is the usual reason a cross-document morph "does not work". */
  @view-transition { navigation: auto; }

  :root { --bg:#fff; --fg:#16181d; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; }
  html[data-theme="dark"] { --bg:#16181d; --fg:#f2f4f8; --muted:#9aa1ad; --line:#2a2e37; --accent:#7aa2f7; }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg); padding:40px 24px;
    font:15px/1.5 ui-sans-serif,system-ui,sans-serif;
    transition:background-color 200ms cubic-bezier(0.23,1,0.32,1), color 200ms;
  }
  .wrap { max-width:860px; margin:0 auto; }
  h1 { font-size:26px; margin:0 0 6px; letter-spacing:-0.02em; }
  .lede { color:var(--muted); margin:0 0 32px; }
  .hero { aspect-ratio:3/2; border-radius:14px; view-transition-name:hero;
          background:linear-gradient(135deg,var(--accent),#7c3aed); }
  button, a.btn { font:inherit; color:inherit; background:var(--bg);
    border:1px solid var(--line); border-radius:8px; padding:7px 13px;
    cursor:pointer; text-decoration:none; display:inline-block; margin-top:24px; }
  button:hover, a.btn:hover { border-color:var(--accent); }

  ::view-transition { pointer-events: none; }
  @media (prefers-reduced-motion: reduce) {
    ::view-transition-old(*), ::view-transition-new(*), ::view-transition-group(*) {
      animation-duration:0s !important; animation-delay:0s !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Alfama walk</h1>
  <p class="lede">Second hop. The same shared element, one more time.</p>
  <div class="hero"></div>
  <a class="btn" href="trips.html">Back</a>
</div>
</body>
</html>
